name: CI - Code Quality & Automated Tests

on:
  push:
    branches: [main, "hardening/**", "fix/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  backend-lint-and-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Unit & Integration Tests
        run: |
          pytest -v tests/ --cov=app --cov-report=term-missing

  frontend-build-and-typecheck:
    name: Frontend TypeScript, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Package Lockfile Exists
        working-directory: frontend
        run: |
          if [ ! -f package-lock.json ]; then
            echo "ERROR: frontend/package-lock.json is missing! A deterministic lockfile is mandatory."
            exit 1
          fi

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: npm test

      - name: TypeScript Type Check & Vite Production Build
        working-directory: frontend
        run: npm run build
